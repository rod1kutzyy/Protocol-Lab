[project]
name = "protocol-lab"
version = "0.1.0"
description = "Offline TCP protocol research laboratory"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "dpkt>=1.9.8,<2",
    "construct>=2.10.70,<3",
    "jinja2>=3.1,<4",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.20,<1",
    "python-dotenv>=1,<2",
]

[project.scripts]
protocol-lab = "protocol_lab.cli.main:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
