# Local PostgreSQL only. The application runs on the host.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: protocol_lab
      POSTGRES_USER: protocol_lab
      POSTGRES_PASSWORD: ${PROTOCOL_LAB_POSTGRES_PASSWORD:?Set PROTOCOL_LAB_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - protocol-lab-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U protocol_lab -d protocol_lab"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  protocol-lab-postgres:
